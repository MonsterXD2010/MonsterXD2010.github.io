
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector QR ESP32</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #202124;
    color: white;
    max-width: 800px;
    margin: 30px auto;
    padding: 15px;
}
section {
    background: #303134;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
}
pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
#estado { color: #8ab4f8; }
</style>
</head>
<body>

<h1>Detector QR ESP32-CAM</h1>

<section>
    <h2>Estado</h2>
    <p id="estado">Esperando imágenes...</p>
    <canvas id="canvas" hidden></canvas>
</section>

<section>
    <h2>Contenido de datos.txt</h2>
    <pre id="datos">Cargando...</pre>
    <button onclick="cargarDatos()">Actualizar TXT</button>
</section>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

let procesando = false;

async function cargarDatos() {
    try {
        const r = await fetch("/datos.txt?t=" + Date.now());
        document.getElementById("datos").textContent =
            await r.text();
    } catch (e) {
        document.getElementById("datos").textContent =
            "No se pudo cargar el archivo.";
    }
}

async function analizar() {
    if (procesando) return;
    procesando = true;

    try {
        const r = await fetch("/siguiente");
        const tarea = await r.json();

        if (tarea.id) {
            document.getElementById("estado").textContent =
                "Analizando imagen #" + tarea.id;

            const img = new Image();

            img.onload = async () => {
                try {
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);

                    const frame = ctx.getImageData(
                        0, 0, canvas.width, canvas.height
                    );

                    const qr = jsQR(
                        frame.data,
                        frame.width,
                        frame.height
                    );

                    const contenido = qr ? qr.data : "";

                    await fetch("/resultado", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            id: tarea.id,
                            encontrado: !!qr,
                            datos: contenido
                        })
                    });

                    document.getElementById("estado").textContent =
                        qr ? "QR detectado correctamente" :
                             "No se encontró ningún QR";

                    await cargarDatos();
                } catch (e) {
                    document.getElementById("estado").textContent =
                        "Error al analizar la imagen";
                } finally {
                    procesando = false;
                }
            };

            img.onerror = async () => {
                document.getElementById("estado").textContent =
                    "No se pudo abrir la imagen";
                procesando = false;
            };

            img.src = "data:image/jpeg;base64," + tarea.imagen;
        } else {
            procesando = false;
        }
    } catch (e) {
        document.getElementById("estado").textContent =
            "Esperando conexión con el servidor...";
        procesando = false;
    }
}

cargarDatos();
setInterval(analizar, 500);
setInterval(cargarDatos, 3000);
</script>

</body>
</html>
